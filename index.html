<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 웹페이지</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
            transition: 0.3s;
        }
        body.dark { background: #181818; color: #f5f5f5; }
        .container { width: 90%; max-width: 700px; margin: 60px auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 36px; margin-bottom: 10px; }
        header p { color: #777; }
        .dark header p { color: #aaa; }
        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .dark .card { background: #252525; }
        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.85; }
        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        #counter, #randomNumber {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin: 20px;
        }
        #clock {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }
        footer {
            text-align: center;
            color: #888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 테스트 웹페이지</h1>
            <p>HTML · CSS · JavaScript 테스트용 페이지</p>
            <button onclick="toggleDarkMode()">🌙 다크모드</button>
        </header>

        <div class="card">
            <h2>현재 시간</h2>
            <div id="clock">00:00:00</div>
        </div>

        <div class="card">
            <h2>👋 인사하기</h2>
            <input type="text" id="nameInput" placeholder="이름을 입력하세요">
            <button onclick="greet()">인사하기</button>
            <h3 id="greeting"></h3>
        </div>

        <div class="card">
            <h2>🖱️ 클릭 테스트</h2>
            <div id="counter">0</div>
            <div style="text-align:center;">
                <button onclick="increaseCounter()">+1</button>
                <button onclick="resetCounter()">초기화</button>
            </div>
        </div>

        <div class="card">
            <h2>🎲 랜덤 숫자 생성</h2>
            <div id="randomNumber">?</div>
            <div style="text-align:center;">
                <button onclick="generateRandom()">랜덤 숫자</button>
            </div>
        </div>

        <footer>HTML + CSS + JavaScript 테스트 페이지</footer>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("clock").textContent =
                `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function greet() {
            const name = document.getElementById("nameInput").value;
            document.getElementById("greeting").textContent =
                name.trim() === "" ? "이름을 입력해주세요!" : `${name}님, 안녕하세요! 👋`;
        }

        let count = 0;
        function increaseCounter() {
            count++;
            document.getElementById("counter").textContent = count;
        }
        function resetCounter() {
            count = 0;
            document.getElementById("counter").textContent = count;
        }

        function generateRandom() {
            const number = Math.floor(Math.random() * 100) + 1;
            document.getElementById("randomNumber").textContent = number;
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
